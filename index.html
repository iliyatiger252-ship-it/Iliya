<style>
:root{
  --pitch:#0C2B1B;
  --pitch-deep:#071A10;
  --line:rgba(233,243,236,.10);
  --chalk:#EAF3EC;
  --muted:#8FAE9B;
  --volt:#C6FF2E;
  --volt-dim:rgba(198,255,46,.16);
  --volt-glow:rgba(198,255,46,.35);
  --pro:#A76EFF;
  --pro-bright:#C9A3FF;
  --card:rgba(255,255,255,.045);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background-color:#071A10}
body{
  background:
    radial-gradient(120% 70% at 50% -10%, #164A2E 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(198,255,46,.05) 0%, transparent 60%),
    linear-gradient(180deg,#0E3120 0%, var(--pitch) 45%, var(--pitch-deep) 100%);
  background-attachment:fixed;
  color:var(--chalk);
  font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  overflow-x:hidden;
}
/* ---------- pitch texture ---------- */
.pitch-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
.pitch-bg svg{width:100%;height:100%}
.glow{position:fixed;z-index:0;pointer-events:none;filter:blur(70px);opacity:.5}
.glow.a{width:280px;height:280px;background:rgba(198,255,46,.16);border-radius:50%;top:-90px;inset-inline-start:-70px}
.glow.b{width:320px;height:320px;background:rgba(46,255,160,.09);border-radius:50%;bottom:-120px;inset-inline-end:-90px}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;padding:0 20px 32px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 6px}
.topbar-3{gap:8px}
.topbar-3 .brand{margin-inline-end:auto}
.topbar .langbtn{white-space:nowrap}

/* ---------- LIGHT THEME ---------- */
body.light{
  --chalk:#12261B; --muted:#5C7568; --line:rgba(18,38,27,.14);
  --card:rgba(18,38,27,.05);
  --volt:#3FA34D; --volt-dim:rgba(63,163,77,.16); --volt-glow:rgba(63,163,77,.35);
  background:
    radial-gradient(120% 70% at 50% -10%, #E6F5E9 0%, transparent 60%),
    linear-gradient(180deg,#F3FAF4 0%, #E9F4EB 45%, #DCEFE0 100%);
  color:var(--chalk);
}
body.light.pro{
  --chalk:#1B1030; --muted:#6A5C86; --line:rgba(27,16,48,.14);
  --volt:#7A3FD6; --volt-dim:rgba(122,63,214,.16); --volt-glow:rgba(122,63,214,.35);
  background:
    radial-gradient(120% 70% at 50% -10%, #EFE6FB 0%, transparent 60%),
    linear-gradient(180deg,#F7F2FE 0%, #EFE7FB 45%, #E4D8F6 100%);
}
body.light .pitch-bg svg{stroke:rgba(18,38,27,.14)}
body.light.pro .pitch-bg svg{stroke:rgba(27,16,48,.13)}
body.light .glow.a,body.light .glow.b{opacity:.25}
body.light .btn:not(.ghost){color:#FFFFFF}
body.light .langmenu{background-color:#FFFFFF;box-shadow:0 18px 40px rgba(0,0,0,.14)}
body.light .toast{background:#FFFFFF;color:var(--chalk)}
body.light input{background:rgba(255,255,255,.75)}
body.light .opt{background:rgba(255,255,255,.7)}
body.light .mode{background:rgba(255,255,255,.7)}
body.light .panel{background:rgba(255,255,255,.7)}
body.light .player,body.light .drill{background:rgba(255,255,255,.75)}
body.light .silo svg{fill:#12261B}
body.light .reveal{background:linear-gradient(160deg, rgba(63,163,77,.16), rgba(63,163,77,.04))}
body.light.pro .reveal{background:linear-gradient(160deg, rgba(122,63,214,.16), rgba(122,63,214,.04))}
.brand{display:flex;align-items:center;gap:8px;font-family:'Anton','Vazirmatn',sans-serif;
  font-size:20px;letter-spacing:.06em;color:var(--chalk)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--volt);box-shadow:0 0 12px var(--volt-glow)}
.langwrap{position:relative}
.langbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.langbtn:hover{color:var(--chalk);border-color:rgba(198,255,46,.35)}
.langmenu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:#0B241700;
  background-color:#0d2718;border:1px solid var(--line);border-radius:14px;padding:6px;min-width:150px;
  box-shadow:0 18px 40px rgba(0,0,0,.45);display:none;z-index:30}
.langmenu.open{display:block}
.langmenu button{width:100%;text-align:start;background:none;border:0;color:var(--chalk);font-family:inherit;
  font-size:14px;padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.langmenu button:hover{background:rgba(198,255,46,.10)}
.langmenu button .soon{color:var(--muted);font-size:11px}
.langmenu button[aria-selected="true"]{color:var(--volt)}

.stagebar{display:flex;gap:6px;padding:2px 2px 4px;margin-bottom:2px}
.stagedot{height:3px;flex:1;border-radius:99px;background:rgba(255,255,255,.09);transition:.3s}
.stagedot.done{background:var(--volt-dim);opacity:.9}
.stagedot.now{background:var(--volt)}

/* ---------- screens ---------- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 0}
.screen{display:none}
.screen.active{display:block;animation:enter .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.step{display:none}
.step.active{display:block;animation:enter .35s cubic-bezier(.2,.7,.3,1) both}

/* ---------- type ---------- */
h1,h2,.display{font-family:'Anton','Vazirmatn',sans-serif;font-weight:900;line-height:1.25;letter-spacing:.01em}
h1{font-size:clamp(28px,7.6vw,40px)}
h2{font-size:clamp(22px,5.6vw,28px)}
.kicker{color:var(--volt);font-size:14px;font-weight:700;margin-bottom:10px}
.sub{color:var(--muted);font-size:15px;margin-top:10px}

/* ---------- controls ---------- */
.field{margin-top:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;color:var(--chalk);font-family:inherit;font-size:17px;outline:none;transition:.18s}
input::placeholder{color:rgba(143,174,155,.6)}
input:focus{border-color:var(--volt);box-shadow:0 0 0 4px var(--volt-dim)}
input[dir="ltr"]{text-align:start}
.btn{width:100%;margin-top:22px;background:var(--volt);color:#06180E;border:0;border-radius:14px;
  padding:16px;font-family:inherit;font-weight:900;font-size:17px;cursor:pointer;
  box-shadow:0 10px 30px rgba(198,255,46,.22);transition:transform .15s, box-shadow .2s, opacity .2s}
.btn:not(.ghost){animation:btnGlow 2.6s ease-in-out infinite}
@keyframes btnGlow{
  0%,100%{box-shadow:0 10px 30px var(--volt-dim)}
  50%{box-shadow:0 10px 40px var(--volt-glow)}
}
.btn:hover{box-shadow:0 14px 38px rgba(198,255,46,.32)}
.btn:hover{animation-play-state:paused}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;font-weight:500;font-size:15px}
.btn.ghost:hover{color:var(--chalk);border-color:rgba(198,255,46,.35)}
.linkbtn{background:none;border:0;color:var(--volt);font-family:inherit;font-size:14px;cursor:pointer;padding:6px 2px}
.linkbtn:disabled{color:var(--muted);cursor:default}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}

/* ---------- login art ---------- */
.crest{display:flex;justify-content:center;margin-bottom:22px}
.crest svg{width:118px;height:118px;filter:drop-shadow(0 0 22px rgba(198,255,46,.25))}

/* ---------- otp ---------- */
.otp{display:flex;gap:9px;direction:ltr;justify-content:space-between;margin-top:18px}
.otp input{flex:1;width:auto;min-width:0;text-align:center;font-size:22px;font-weight:700;padding:14px 0;border-radius:13px}
.otprow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;font-size:14px;color:var(--muted)}

/* ---------- welcome ---------- */
.stadium{position:relative;margin:0 -20px 6px;overflow:hidden}
.stadium svg{width:100%;display:block}

/* ---------- quiz ---------- */
.progress{display:flex;gap:6px;margin:0 0 22px}
.progress span{height:4px;flex:1;background:rgba(255,255,255,.09);border-radius:99px;transition:.35s}
.progress span.done{background:var(--volt)}
.qcount{font-size:13px;color:var(--muted);margin-bottom:6px}
.opts{margin-top:20px;display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;color:var(--chalk);font-family:inherit;font-size:16px;text-align:start;
  cursor:pointer;transition:border-color .18s, background .18s, transform .12s}
.opt::after{content:'›';margin-inline-start:auto;color:var(--muted);font-size:19px;flex:0 0 auto}
html[dir="rtl"] .opt::after{content:'‹'}
.opt.picked::after{content:'✓';color:var(--volt)}
.opt:hover{border-color:rgba(198,255,46,.4);background:rgba(198,255,46,.06)}
.opt:active{transform:scale(.99)}
.opt.picked{border-color:var(--volt);background:rgba(198,255,46,.12)}
.opt .em{font-size:20px;line-height:1}
.backrow{margin-top:18px;text-align:center}

/* ---------- loading ---------- */
.loading{text-align:center;padding:40px 0}
.ball{width:64px;height:64px;margin:0 auto 26px;border-radius:50%;border:3px solid rgba(255,255,255,.12);
  border-top-color:var(--volt);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadmsg{font-size:17px;font-weight:700;min-height:28px}

/* ---------- result ---------- */
.reveal{margin-top:16px;padding:26px 20px;border-radius:22px;text-align:center;
  background:linear-gradient(160deg, rgba(198,255,46,.16), rgba(198,255,46,.03));
  border:1px solid rgba(198,255,46,.32);animation:pop .5s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.reveal .posname{font-family:'Anton','Vazirmatn',sans-serif;font-size:clamp(26px,7vw,36px);color:var(--volt);
  text-shadow:0 0 26px rgba(198,255,46,.35);line-height:1.35}
.reveal .or{color:var(--muted);font-size:15px;font-family:'Vazirmatn',sans-serif}
.jersey{width:118px;height:auto;display:block;margin:0 auto 10px}
.bigpitch{width:100%;max-width:230px;height:auto;display:block;margin:16px auto 2px}
.spot{animation:pulse 1.9s ease-in-out infinite;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.altpos{margin-top:10px;font-size:14.5px;color:var(--muted)}
.altpos b{color:var(--chalk);font-weight:700}
.drills{display:grid;gap:9px;margin-top:4px;counter-reset:d}
.drill{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.04);
  border-radius:13px;padding:11px 13px;font-size:15px;line-height:1.6}
.drill .n{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:var(--volt-dim);
  color:var(--volt);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.count{font-family:'Anton','Vazirmatn',sans-serif;font-size:80px;line-height:1;color:var(--volt);
  text-shadow:0 0 40px var(--volt-glow);animation:countpop .55s cubic-bezier(.2,.8,.3,1.3) both}
@keyframes countpop{from{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.06)}to{transform:scale(1)}}
.panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h3{font-size:15px;color:var(--volt);margin-bottom:10px;font-weight:700}
.growintro{color:var(--muted);font-size:14.5px;margin-bottom:8px}

.scrollhint{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .4s}
.scrollhint.hide{opacity:0;pointer-events:none}
.scrollhint span{font-size:20px;color:var(--volt);animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.reveal-lock{text-align:center;padding:14px 6px 6px}
.reveal-lock .lock-icon{font-size:30px;margin-bottom:8px;filter:grayscale(.2)}
.reveal-lock p{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.reveal-btn{margin-top:0 !important}
.players{animation:enter .4s cubic-bezier(.2,.7,.3,1) both}

.drills{display:flex;gap:10px;margin-top:4px;overflow-x:auto;scroll-snap-type:x proximity;
  padding-bottom:4px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.drills::-webkit-scrollbar{display:none}
.drill{flex:0 0 82%;scroll-snap-align:start;display:flex;gap:11px;align-items:flex-start;
  background:rgba(255,255,255,.04);border-radius:13px;padding:14px 15px;font-size:15px;line-height:1.6}
.players{display:grid;gap:10px;margin-top:12px}
.player{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-radius:13px;padding:11px 13px}
.player svg{width:30px;height:30px;flex:0 0 auto}
.player b{font-weight:700;font-size:16px}

/* ---------- toast ---------- */
.toast{position:fixed;top:16px;inset-inline-start:50%;transform:translate(-50%,-24px);z-index:50;
  background:#0d2718;border:1px solid rgba(198,255,46,.35);color:var(--chalk);padding:10px 16px;
  border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
html[dir="rtl"] .toast{transform:translate(50%,-24px)}
html[dir="rtl"] .toast.show{transform:translate(50%,0)}
.err{color:#ff8f6b;font-size:13.5px;margin-top:8px;min-height:18px}
.privacy{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.6}
.pwwrap{position:relative}
.pwwrap input{padding-inline-end:52px}
.eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;
  font-size:19px;cursor:pointer;padding:8px;line-height:1;opacity:.65}
.eye:hover{opacity:1}
.eye.on{opacity:1;filter:drop-shadow(0 0 6px var(--volt-glow))}
.resume{margin-top:14px;background:transparent;color:var(--volt);
  border:1px solid rgba(198,255,46,.45);box-shadow:none;font-size:15px;text-align:center}
.resume:hover{background:rgba(198,255,46,.08);box-shadow:none}

/* ---------- admin ---------- */
.adminwrap{text-align:center;padding:20px 0}
.admincard{margin-top:22px;padding:30px 20px;border-radius:22px;
  background:linear-gradient(160deg, rgba(198,255,46,.16), rgba(198,255,46,.03));
  border:1px solid rgba(198,255,46,.32)}
.admincount{font-family:'Anton','Vazirmatn',sans-serif;font-size:64px;color:var(--volt);
  text-shadow:0 0 26px rgba(198,255,46,.35);line-height:1.2}
.adminlabel{color:var(--muted);font-size:14px;margin-top:6px}

/* ---------- logo ---------- */
.logo-mark{display:block;border-radius:50%;object-fit:contain;flex:0 0 auto}
.brand .logo-mark{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(198,255,46,.35))}
.crest .logo-mark{width:132px;height:132px;filter:drop-shadow(0 0 26px rgba(198,255,46,.3))}
.welcome-mark{display:flex;justify-content:center;margin:4px 0 14px}
.welcome-mark .logo-mark{width:84px;height:84px;filter:drop-shadow(0 0 20px rgba(198,255,46,.28))}

/* ---------- decorative silhouettes (result) ---------- */
#s-result{position:relative}
#s-result > *{position:relative;z-index:1}
#s-result > .silo{position:absolute;z-index:0;bottom:-6px;opacity:.12;pointer-events:none}
#s-result > .silo.left{inset-inline-start:-10px;width:132px}
#s-result > .silo.right{inset-inline-end:-10px;width:138px}
#s-result > .silo svg{width:100%;height:auto;display:block}

/* ---------- mode select ---------- */
.modes{display:grid;gap:14px;margin-top:24px}
.mode{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:18px;color:var(--chalk);font-family:inherit;cursor:pointer;transition:.2s}
.mode:hover{border-color:var(--volt);background:rgba(198,255,46,.07);transform:translateY(-2px)}
.mode .mtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mode .mico{font-size:24px}
.mode .mname{font-family:'Anton','Vazirmatn',sans-serif;font-size:19px;color:var(--volt)}
.mode .mdesc{color:var(--muted);font-size:14px;line-height:1.6}
.mode .mmeta{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.mode.pro{border-color:rgba(167,110,255,.4);background:linear-gradient(160deg,rgba(167,110,255,.13),rgba(167,110,255,.03))}
.mode.pro:hover{border-color:var(--pro);background:rgba(167,110,255,.16)}
.mode.pro .mname{color:var(--pro-bright)}
.probadge{display:inline-block;background:rgba(167,110,255,.22);color:var(--pro-bright);
  border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-inline-start:6px}

/* ---------- PRO theme: purple takeover while in pro mode ---------- */
body.pro{
  background:
    radial-gradient(120% 70% at 50% -10%, #2A1150 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(167,110,255,.07) 0%, transparent 60%),
    linear-gradient(180deg,#25104A 0%, #1B0B36 45%, #0E0620 100%);
}
body.pro{--volt:var(--pro-bright); --volt-dim:rgba(167,110,255,.18);
  --volt-glow:rgba(167,110,255,.42); --muted:#A79ABF; --line:rgba(233,230,243,.12)}
body.pro .glow.a{background:rgba(167,110,255,.20)}
body.pro .glow.b{background:rgba(120,80,255,.14)}
body.pro .btn:not(.ghost){color:#160A2B}
body.pro .pitch-bg svg{stroke:rgba(233,230,243,.12)}

/* ---------- pitch zone picker ---------- */
.zonewrap{margin-top:18px;position:relative;touch-action:none;user-select:none;
  border-radius:16px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.zonewrap svg{width:100%;display:block}
.zonebox{position:absolute;border:2px solid var(--volt);background:rgba(167,110,255,.22);
  border-radius:6px;cursor:move;box-shadow:0 0 18px var(--volt-glow)}
.zhandle{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--volt);
  border:2px solid #160A2B;touch-action:none}
.zhandle.tl{inset-inline-start:-13px;top:-13px;cursor:nwse-resize}
.zhandle.br{inset-inline-end:-13px;bottom:-13px;cursor:nwse-resize}
.zonehint{color:var(--muted);font-size:13px;margin-top:10px;text-align:center}

/* ---------- honesty line + battle mode ---------- */
.honesty{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.6;
  border-inline-start:2px solid var(--volt);padding-inline-start:10px}
.battleintro{background:var(--volt-dim);border:1px solid var(--volt);border-radius:12px;
  padding:10px 12px;font-size:13.5px;margin-top:10px;line-height:1.6}
.pulse-vs{animation:btnGlow 2.2s ease-in-out infinite}
.waitcard{max-width:220px;margin:16px auto 4px}
.waitcard canvas{width:100%;border-radius:12px;display:block;
  filter:drop-shadow(0 14px 30px rgba(0,0,0,.4))}
.arenahead{text-align:center;margin-top:6px}
.arenahead h2{font-family:'Anton','Vazirmatn',sans-serif;font-size:24px;color:var(--volt);min-height:30px}
.arenarow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}
.arenaside{flex:1;max-width:44%;text-align:center}
.arenaside canvas{width:100%;border-radius:10px;display:block;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.4));transition:filter .4s, transform .4s}
.arenaside.winner canvas{filter:drop-shadow(0 0 26px var(--volt-glow)) drop-shadow(0 10px 24px rgba(0,0,0,.4));
  transform:scale(1.05)}
.arenaside.loser canvas{opacity:.55;filter:grayscale(.5)}
.arenascore{font-family:'Anton','Vazirmatn',sans-serif;font-size:34px;color:var(--volt);margin-top:8px}
.arenavs{font-family:'Anton','Vazirmatn',sans-serif;font-size:15px;color:var(--muted);flex:0 0 auto}
.arenaresult{text-align:center;margin-top:22px}
.arenaresult h2{font-family:'Anton','Vazirmatn',sans-serif;font-size:24px;color:var(--volt);margin-bottom:14px}
.roundflash{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0}
.roundflash.show{opacity:1;animation:roundPop .8s ease both}
.roundflash span{font-family:'Anton','Vazirmatn',sans-serif;font-size:44px;color:var(--volt);
  text-shadow:0 0 30px var(--volt-glow);background:rgba(0,0,0,.55);padding:10px 26px;border-radius:14px}
@keyframes roundPop{0%{transform:scale(.7);opacity:0}20%{transform:scale(1.08);opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes sanctify{
  0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  50%{filter:drop-shadow(0 0 50px rgba(255,255,255,.85)) brightness(1.3)}
  100%{filter:drop-shadow(0 0 26px var(--volt-glow))}
}
.sanctifying canvas{animation:sanctify 1.4s ease both}

/* ---------- card maker ---------- */
.cardpreview{margin:18px auto 4px;max-width:300px;perspective:1000px;
  touch-action:none;user-select:none;-webkit-user-select:none}
.card3d{position:relative;transform-style:preserve-3d;will-change:transform;
  transition:transform .5s cubic-bezier(.2,.8,.3,1);
  animation:cardFloat 6s ease-in-out infinite}
.card3d.grabbing{transition:none;animation:none}
.card3d.spinning{animation:none;transition:transform 1.15s cubic-bezier(.35,.02,.2,1)}
.card3d.posed{animation:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{position:relative}
.face.back{transform:rotateY(180deg)}
.face canvas{width:100%;height:auto;display:block;border-radius:14px;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}

@keyframes cardFloat{
  0%,100%{transform:rotateY(-7deg) rotateX(3deg) translateZ(0)}
  50%{transform:rotateY(7deg) rotateX(-3deg) translateZ(14px)}
}
.glare,.shine{position:absolute;inset:0;border-radius:14px;pointer-events:none}
.glare{background:linear-gradient(115deg,
  rgba(255,255,255,0) 36%, rgba(255,255,255,.32) 50%, rgba(255,255,255,0) 64%);
  opacity:.16;mix-blend-mode:screen;transition:opacity .3s}
.card3d.grabbing .glare{opacity:.30;transition:none}
.shine{background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),
  rgba(255,255,255,.20), rgba(255,255,255,0) 52%);
  opacity:0;mix-blend-mode:screen;transition:opacity .3s}
.card3d.grabbing .shine{opacity:.85;transition:none}
.tilthint{text-align:center;color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.spinrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.cardctl{display:flex;gap:10px;margin-top:6px}
.cardctl .btn{margin-top:10px}
.poschips,.stylechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;color:var(--chalk);font-family:inherit;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--volt)}
.chip.on{background:var(--volt-dim);border-color:var(--volt);color:var(--volt);font-weight:700}
.statlist{margin-top:16px;display:grid;gap:12px}
.statrow{display:grid;grid-template-columns:52px 1fr 42px;align-items:center;gap:10px}
.statrow .sname{font-family:'Anton','Vazirmatn',sans-serif;font-size:14px;letter-spacing:.08em;color:var(--muted)}
.statrow .sval{font-family:'Anton','Vazirmatn',sans-serif;font-size:17px;color:var(--volt);text-align:center}
.statrow input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;
  border-radius:99px;background:var(--card);outline:none;padding:0}
.statrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--volt);cursor:pointer;box-shadow:0 0 10px var(--volt-glow)}
.statrow input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;
  border-radius:50%;background:var(--volt);cursor:pointer}

/* ---------- crop overlay ---------- */
.cropmodal{position:fixed;inset:0;z-index:60;background:rgba(4,10,7,.92);
  display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.cropmodal.open{display:flex}
.cropinner{width:100%;max-width:460px}
.cropinner h3{font-family:'Anton','Vazirmatn',sans-serif;font-size:20px;margin-bottom:4px}
.cropstage{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;
  touch-action:none;user-select:none;background:#000}
.cropstage img{width:100%;display:block;pointer-events:none}
.cropbox{position:absolute;border:2px solid var(--volt);border-radius:6px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

        <h1 data-i="login.title"></h1>
        <p class="sub" data-i="login.sub"></p>
        <div class="field">
          <label for="phone" data-i="login.phoneLabel"></label>
          <input id="phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="09xx xxx xxxx">
          <div class="err" id="phone-err"></div>
          <p class="privacy" data-i="login.privacy"></p>
        </div>
        <button class="btn" id="check-phone" data-i="login.send"></button>
        <button class="btn ghost" id="bio-login" style="display:none" data-i="bio.loginBtn"></button>
      </div>

      <div class="step" id="step-password">
        <h1 id="pw-title"></h1>
        <p class="sub" id="pw-sub"><b id="phone-echo" dir="ltr"></b></p>
        <div class="field">
          <label for="password" data-i="pw.label"></label>
          <div class="pwwrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••">
            <button type="button" class="eye" id="pw-eye" aria-label="show password">👁️</button>
          </div>
          <div class="err" id="pw-err"></div>
        </div>
        <div class="otprow">
          <button class="linkbtn" id="forgot-pw" style="display:none" data-i="pw.forgot"></button>
          <button class="linkbtn" id="editphone" data-i="otp.edit"></button>
        </div>
        <button class="btn" id="pw-submit"></button>
      </div>

      <div class="step" id="step-biometric">
        <div class="kicker" data-i="bio.kicker"></div>
        <h1 data-i="bio.title"></h1>
        <p class="sub" data-i="bio.sub"></p>
        <button class="btn" id="bio-enable" data-i="bio.enable"></button>
        <button class="btn ghost" id="bio-skip" data-i="bio.skip"></button>
      </div>
    </section>

      <div class="kicker" data-i="welcome.kicker"></div>
      <h1 data-i="welcome.title"></h1>
      <p class="sub" data-i="welcome.sub"></p>
      <button class="btn resume" id="resume-btn" style="display:none"></button>
      <button class="btn" id="go-info" data-i="welcome.cta"></button>
      <button class="btn ghost" id="go-card" data-i="card.entry"></button>
    </section>

    <!-- ============ ADMIN PANEL ============ -->
    <section class="screen" id="s-admin">
      <div class="adminwrap">
        <div class="kicker" data-i="admin.kicker"></div>
        <h1 data-i="admin.title"></h1>
        <div class="admincard">
          <div class="admincount" id="admin-count">—</div>
          <div class="adminlabel" data-i="admin.label"></div>
        </div>
        <button class="btn" id="admin-continue" data-i="admin.continue"></button>
      </div>
    </section>

    <!-- ============ CARD MAKER ============ -->
    <section class="screen" id="s-card">
      <div class="kicker" data-i="card.kicker"></div>
      <h2 data-i="card.title"></h2>
      <p class="honesty" data-i="card.honesty"></p>
      <p class="battleintro" id="battle-intro" style="display:none"></p>

      <div class="cardpreview" id="card-stage">
        <div class="card3d" id="card3d">
          <div class="face front">
            <canvas id="card-canvas" width="1080" height="1512"></canvas>
            <div class="glare" id="card-glare"></div>
            <div class="shine" id="card-shine"></div>
          </div>
          <div class="face back">
            <canvas id="card-back-canvas" width="1080" height="1512"></canvas>
            <div class="glare"></div>
          </div>
        </div>
      </div>
      <div class="spinrow">
        <button class="chip" id="card-spin" data-i="card.spin"></button>
        <button class="chip" id="card-flip" data-i="card.flip"></button>
      </div>
      <p class="tilthint" data-i="card.tiltHint"></p>

      <div class="cardctl">
        <button class="btn ghost" id="pick-photo" data-i="card.pickPhoto"></button>
        <input type="file" id="photo-input" accept="image/*" style="display:none">
      </div>

      <div class="field">
        <label for="card-name" data-i="card.name"></label>
        <input id="card-name" type="text" maxlength="14" data-ph="info.phName">
      </div>

      <div class="field">
        <label data-i="card.position"></label>
        <div class="poschips" id="card-pos"></div>
      </div>

      <div class="statlist" id="card-stats"></div>

      <div class="field">
        <label data-i="card.style"></label>
        <div class="stylechips" id="card-styles"></div>
      </div>

      <button class="btn" id="card-share" data-i="card.share"></button>
      <button class="btn ghost pulse-vs" id="card-vs" data-i="card.vs"></button>
      <button class="btn" id="card-accept" data-i="card.accept" style="display:none"></button>
      <div class="err" id="card-err"></div>
      <button class="btn ghost" id="card-back" data-i="card.back"></button>
    </section>

    <!-- ============ VS FRIEND — explanation ============ -->
    <div class="cropmodal" id="vs-explain-modal">
      <div class="cropinner">
        <h3 data-i="card.vsExplainTitle"></h3>
        <p class="sub" data-i="card.vsExplainBody"></p>
        <button class="btn" id="vs-explain-ok" data-i="card.vsExplainOk"></button>
      </div>
    </div>

    <!-- ============ BATTLE: waiting for opponent ============ -->
    <section class="screen" id="s-battle-wait">
      <div class="kicker" data-i="battle.waitKicker"></div>
      <h2 data-i="battle.waitTitle"></h2>
      <div class="waitcard">
        <canvas id="wait-card-canvas" width="480" height="672"></canvas>
      </div>
      <div class="loading" style="padding:14px 0">
        <div class="ball" aria-hidden="true"></div>
        <div class="loadmsg" data-i="battle.waitSub"></div>
      </div>
      <button class="btn ghost" id="battle-copy" data-i="battle.copyLink"></button>
      <button class="btn ghost" id="battle-share-link" data-i="battle.shareLink"></button>
      <button class="btn ghost" id="battle-cancel" data-i="battle.cancel"></button>
    </section>

    <!-- ============ BATTLE: invited screen ============ -->
    <section class="screen" id="s-battle-intro">
      <div class="kicker" data-i="battle.introKicker"></div>
      <h2 id="battle-intro-title"></h2>
      <div class="waitcard">
        <canvas id="intro-card-canvas" width="480" height="672"></canvas>
      </div>
      <p class="sub" data-i="battle.introSub"></p>
      <button class="btn" id="battle-intro-go" data-i="battle.introGo"></button>
      <div class="err" id="battle-intro-err"></div>
    </section>

    <!-- ============ BATTLE: arena ============ -->
    <section class="screen" id="s-battle-arena">
      <div class="arenahead">
        <div class="kicker" data-i="battle.arenaKicker"></div>
        <h2 id="arena-round-label">&nbsp;</h2>
      </div>
      <div class="arenarow">
        <div class="arenaside" id="arena-left">
          <canvas id="arena-left-canvas" width="480" height="672"></canvas>
          <div class="arenascore" id="arena-left-score">0</div>
        </div>
        <div class="arenavs">VS</div>
        <div class="arenaside" id="arena-right">
          <canvas id="arena-right-canvas" width="480" height="672"></canvas>
          <div class="arenascore" id="arena-right-score">0</div>
        </div>
      </div>
      <div class="arenaresult" id="arena-result" style="display:none">
        <h2 id="arena-result-title"></h2>
        <button class="btn" id="arena-share" data-i="battle.shareResult"></button>
        <button class="btn ghost" id="arena-done" data-i="battle.done"></button>
      </div>
    </section>

    <!-- ============ PHOTO CROP OVERLAY ============ -->
    <div class="cropmodal" id="crop-modal">
      <div class="cropinner">
        <h3 data-i="card.cropTitle"></h3>
        <p class="sub" data-i="card.cropHint"></p>
        <div class="cropstage" id="crop-stage">
          <img id="crop-img" alt="">
          <div class="cropbox" id="crop-box">
            <div class="zhandle tl" id="crop-tl"></div>
            <div class="zhandle br" id="crop-br"></div>
          </div>
        </div>
        <button class="btn" id="crop-ok" data-i="card.cropOk"></button>
        <button class="btn ghost" id="crop-cancel" data-i="card.cropCancel"></button>
      </div>
    </div>

    <!-- ============ MODE SELECT ============ -->
    <section class="screen" id="s-mode">
      <div class="kicker" data-i="mode.kicker"></div>
      <h2 data-i="mode.title"></h2>
      <div class="modes">
        <button class="mode" id="mode-quick">
          <div class="mtop"><span class="mico">⚡</span><span class="mname" data-i="mode.quickName"></span></div>
          <div class="mdesc" data-i="mode.quickDesc"></div>
          <div class="mmeta"><span data-i="mode.quickMeta"></span></div>
        </button>
        <button class="mode pro" id="mode-pro">
          <div class="mtop"><span class="mico">🎯</span><span class="mname" data-i="mode.proName"></span>
            <span class="probadge" data-i="mode.proBadge"></span></div>
          <div class="mdesc" data-i="mode.proDesc"></div>
          <div class="mmeta"><span data-i="mode.proMeta"></span></div>
        </button>
      </div>
    </section>

    <!-- ============ SCREEN 3 : INFO ============ -->
    <section class="screen" id="s-info">
      <div class="kicker" data-i="info.kicker"></div>
      <h2 data-i="info.title"></h2>
      <div class="field">
        <label for="f-name" data-i="info.name"></label>
        <input id="f-name" type="text" autocomplete="given-name" data-ph="info.phName">
      </div>
      <div class="field">
        <label for="f-age" data-i="info.age"></label>
        <input id="f-age" type="number" inputmode="numeric" min="5" max="60" dir="ltr" placeholder="15">
      </div>

function smallPhotoDataUrl(img, maxDim){
  if(!img) return null;
  const scale = Math.min(1, (maxDim||260)/Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  try{ return c.toDataURL('image/webp', 0.72); }
  catch(e){ return c.toDataURL('image/png'); }
}

function currentCardPayload(){
  return {
    name: (cardState.name || '').trim().slice(0,14) || 'Player',
    pos: cardState.pos,
    stats: {...cardState.stats},
    style: cardState.style,
    ovr: cardOVR(),
    photo: smallPhotoDataUrl(cardState.cutout || cardState.photo, 260)
  };
}

async function saveCardToServer(){
  if(!sb) return null;
  const payload = currentCardPayload();
  try{
    const { data, error } = await sb.rpc('save_card', {
      p: state.phone, nm: payload.name, pos: payload.pos,
      stats: payload.stats, style: payload.style, photo: payload.photo
    });
    if(error) throw error;
    cardState.saved = true;
    return payload;
  }catch(e){ console.warn('save_card failed', e); return null; }
}

  try{

    if(error) throw error;
    return (data && data.length) ? data[0] : (data && data.name ? data : null);
  }catch(e){ console.warn('load_card failed', e); return null; }
}

}

async function fetchBattle(battleId){
  if(!sb) return null;
  try{
    const { data, error } = await sb.from('battles').select('*').eq('id', battleId).single();
    if(error) throw error;
    return data;
  }catch(e){ console.warn('fetchBattle failed', e); return null; }
}

let battleChannel = null;
function subscribeBattle(battleId, onUpdate){
  if(!sb) return;
  unsubscribeBattle();
  try{
    battleChannel = sb.channel('battle-'+battleId)
      .on('postgres_changes',
        { event:'UPDATE', schema:'public', table:'battles', filter:`id=eq.${battleId}` },
        payload => onUpdate(payload.new))
      .subscribe();
  }catch(e){ console.warn('realtime subscribe failed', e); }
}
function unsubscribeBattle(){
  if(battleChannel && sb){ try{ sb.removeChannel(battleChannel); }catch(e){} battleChannel = null; }
}

function battleLink(battleId){
  return location.origin + location.pathname + '?battle=' + battleId;
}

/* turn the user's own answers into a playstyle tag multiset (not position-based) */
function playstyleTags(){
  const a = state.answers, tags = [];
  const add = (...x)=>tags.push(...x);
  if(a.foot==='right') add('footRight');
  if(a.foot==='left') add('footLeft');
  if(a.foot==='both') add('footBoth');
  if(a.goal==='header') add('header');
  if(a.goal==='one') add('dribbleFinish');
  if(a.goal==='long') add('longshot');
  if(a.goal==='flashy') add('flashy');
  if(a.mode==='dribble') add('dribble');
  if(a.mode==='defense') add('defense');
  if(a.mode==='both') add('dribble','defense');
  if(a.strength==='speed') add('speed');
  if(a.strength==='power') add('power');
  if(a.strength==='technique') add('technique');
  if(a.strength==='jump') add('jump');
  if(a.pressure==='quickShort') add('shortPass');
  if(a.pressure==='dribblePast') add('dribble');
  if(a.pressure==='holdUp') add('holdup');
  if(a.pressure==='longBall') add('longpass');
  if(a.duel==='physical') add('physical');
  if(a.duel==='speedRecover') add('paceRecovery');
  if(a.duel==='jockey') add('jockey');
  if(a.duel==='rarelyDefend') add('flashy');
  if(a.passing==='shortSafe') add('shortPass');
  if(a.passing==='throughBall') add('vision');
  if(a.passing==='crosses') add('crossing');
  if(a.passing==='longDiagonal') add('longpass');
  if(a.offball==='runsBehind') add('runsInBehind');
  if(a.offball==='dropDeep') add('positional');
  if(a.offball==='holdLine') add('positional');
  if(a.offball==='wideSpace') add('wide');
  return tags;
}

/* pick the 2 pool players whose tags best match this user's own answers */
function pickPlayers(pos, count){
  const tags = playstyleTags();
  const pool = PLAYERS[pos];
  const seen = new Set();
  return pool.map((pl,i)=>({
      n:pl.n, i, score: pl.tags.reduce((s,tag)=>s + tags.filter(x=>x===tag).length, 0)
    }))
    .sort((a,b)=> b.score - a.score || a.i - b.i)
    .filter(x=>{ const base = x.n.replace(/\s*\(.*\)$/,''); if(seen.has(base)) return false; seen.add(base); return true; })
    .slice(0, count || 2)
    .map(x=>x.n);
}

/* height / weight brackets — secondary, backend only, never shown */
function physicalBonus(){
  const b = {}; POS.forEach(p=>b[p]=0);
  const h = state.height, w = state.weight;
  if(!h || !w) return b;
  const idx = w / Math.pow(h/100, 2);            // weight relative to height
  const H = h>=180 ? 'tall' : (h>=171 ? 'medtall' : (h>=162 ? 'med' : 'short'));
  const F = idx>=23 ? 'heavy' : (idx>=19.5 ? 'mid' : 'light');

  if(H==='tall') b.GK += 2; else if(H==='medtall') b.GK += 1;
  if(H==='tall') b.CB += 1;
  if(F==='heavy') b.CB += 1;
  if(H==='tall' || H==='medtall') b.CF += 1;
  if(F!=='light') b.CF += 1;
  if(F==='heavy') b.DM += 2; else if(F==='mid') b.DM += 1;
  // AM: neutral by design
  if(H==='short' || H==='med') ['LB','RB','LW','RW'].forEach(p=>b[p]+=1);
  if(F==='light') ['LB','RB','LW','RW'].forEach(p=>b[p]+=1);
  return b;
}

function hasTrait(x){
  const a = state.answers;
  if(x==='speed') return a.strength==='speed';
  if(x==='power') return a.strength==='power';
  if(x==='technique') return a.strength==='technique';
  if(x==='jump') return a.strength==='jump';
  if(x==='dribble') return a.mode==='dribble' || a.mode==='both';
  if(x==='defense') return a.mode==='defense' || a.mode==='both';
  if(x==='finish') return a.goal!=='none';
  if(x==='longshot') return a.goal==='long';
  if(x==='twofoot') return a.foot==='both';
  return false;
}

function growthTip(top){
  const P = T[lang].pos, L = TRAITS[lang];
  const wanted = [...new Set(top.flatMap(p=>POS_TRAITS[p]))];
  let miss = wanted.filter(x=>!hasTrait(x));
  if(!miss.length) miss = ['vision','stamina'];
  const pick = miss.slice(0,2);
  const posText = top.map(p=>P[p]).join(t('result.or'));
  const key = pick.length>1 ? 'result.growTwo' : 'result.growOne';
  return t(key).replace('{pos}', posText).replace('{a}', L[pick[0]]).replace('{b}', L[pick[1]] || '');
}

/* =========================================================
   scoring  (internal only — never shown)
========================================================= */
function computeScores(){
  const s = {}; POS.forEach(p=>s[p]=0);
  const add = (arr,n)=>arr.forEach(p=>s[p]+=n);
  const a = state.answers;

  // weight
  const w = state.weight;
  if(w < 60) add(['CF','LW','RW','GK'],2);
  else if(w <= 70) add(['AM','DM'],2);
  else add(['CB','RB','LB'],2);

  // Q1 foot
  if(a.foot==='right') add(['RB','AM','DM','RW','CF','GK'],2);
  if(a.foot==='left')  add(['LB','AM','DM','LW','CF','GK'],2);
  if(a.foot==='both'){ add(POS,2); add(['AM','CF'],1); }

  // Q2 goal
  if(a.goal==='header') add(['CB','CF'],3);
  if(a.goal==='one'){ add(['CF','LW','RW'],3); add(['AM'],2); }
  if(a.goal==='long'){ add(['CF','DM'],3); add(['AM'],4); }
  if(a.goal==='flashy'){ add(['LW','RW'],3); add(['AM'],2); }
  if(a.goal==='none'){ add(['GK'],3); add(['CB'],2); }

  // Q3 dribble / defense
  if(a.mode==='dribble'){ add(['CF','LW','RW'],3); add(['LB','RB','AM'],2); }
  if(a.mode==='defense'){ add(['DM','RB','LB'],3); add(['CB'],4); }
  if(a.mode==='both') add(['AM','DM'],3);

  // Q4 strength
  if(a.strength==='speed') add(['LW','RW','LB','RB'],2);
  if(a.strength==='power') add(['RB','LB','DM','CF'],2);
  if(a.strength==='technique') add(['LW','RW'],2);
  if(a.strength==='jump') add(['GK','CB','CF'],2);

  // Q5 favourite (aspirational — light weight, used mainly for tie-break flavour)
  if(a.fav) add([a.fav], a.fav==='GK' ? 4 : 2);

  // anchor — the position they actually play in real games (heavy weight, but not absolute)
  if(a.anchor) add([a.anchor], a.anchor==='GK' ? 8 : 6);

  // off-ball movement
  if(a.offball==='runsBehind'){ add(['CF'],3); add(['LW','RW'],2); }
  if(a.offball==='dropDeep'){ add(['AM'],3); add(['DM'],2); }
  if(a.offball==='holdLine'){ add(['CB'],3); add(['RB','LB'],1); }
  if(a.offball==='wideSpace'){ add(['LW','RW'],3); add(['RB','LB'],1); }

  // decision under pressure
  if(a.pressure==='quickShort'){ add(['DM'],3); add(['CB'],2); }
  if(a.pressure==='dribblePast') add(['LW','RW','AM','CF'],2);
  if(a.pressure==='holdUp'){ add(['CF'],3); add(['AM'],1); }
  if(a.pressure==='longBall') add(['DM','CB','GK'],2);

  // passing style
  if(a.passing==='shortSafe'){ add(['DM'],3); add(['CB'],2); }
  if(a.passing==='throughBall') add(['AM'],3);
  if(a.passing==='crosses') add(['LW','RW','RB','LB'],2);
  if(a.passing==='longDiagonal') add(['CB','DM','GK'],2);

  // defensive duel style
  if(a.duel==='physical'){ add(['CB'],3); add(['DM'],2); }
  if(a.duel==='speedRecover'){ add(['RB','LB'],2); add(['RW','LW'],1); }
  if(a.duel==='jockey'){ add(['CB'],2); add(['RB','LB'],1); }
  if(a.duel==='rarelyDefend'){ add(['CF'],3); add(['LW','RW','AM'],1); }

  // secondary: height / weight brackets (small, tie-breaking weight only)
  const bonus = physicalBonus();
  POS.forEach(p=>s[p] += bonus[p]);

  return s;
}

/* the pitch-zone picker returns {cx,cy,w,h} as 0..1 fractions of the pitch,
   where y=0 is the opponent's goal and y=1 is our own goal */
function zoneScores(z){
  const b = {}; POS.forEach(p=>b[p]=0);
  if(!z) return b;
  const add = (arr,n)=>arr.forEach(p=>b[p]+=n);
  const {cx, cy, w, h} = z;

  // vertical band -> how advanced the player is
  if(cy < 0.22)      add(['CF'],7), add(['LW','RW'],4), add(['AM'],3);
  else if(cy < 0.40) add(['AM'],7), add(['LW','RW'],5), add(['CF'],3);
  else if(cy < 0.58) add(['DM'],6), add(['AM'],4), add(['LB','RB'],3);
  else if(cy < 0.78) add(['CB'],5), add(['DM'],5), add(['LB','RB'],4);
  else               add(['GK'],8), add(['CB'],4);

  // horizontal band -> which side/channel
  if(cx < 0.30)      add(['LW','LB'],5), add(['CF','AM','DM','CB'],0);
  else if(cx > 0.70) add(['RW','RB'],5);
  else               add(['CF','AM','DM','CB','GK'],3);

  // shape of the box -> role width
  if(w < 0.34 && h > 0.45) add(['LB','RB','LW','RW'],3);      // narrow + tall = a lane
  if(w > 0.62 && h < 0.34) add(['CB','DM'],3);                 // wide + short = a line
  if(w < 0.34 && h < 0.30) add(['CF','GK'],3);                 // small + tight = a fixed spot
  if(w > 0.55 && h > 0.55) add(['AM','DM'],2);                 // covers a lot = box-to-box

  return b;
}

function computeProScores(){
  const s = {}; POS.forEach(p=>s[p]=0);
  const add = (arr,n)=>arr.forEach(p=>s[p]+=n);
  const a = state.answers;

  // 1 first touch under pressure
  if(a.touch==='intoSpace'){ add(['LW','RW','AM'],3); add(['CF'],2); }
  if(a.touch==='holdIt'){ add(['CF'],4); add(['AM','DM'],2); }
  if(a.touch==='oneTouch'){ add(['DM','CB'],3); add(['GK'],2); }
  if(a.touch==='shootIt'){ add(['CF'],3); add(['LW','RW'],2); }

  // 2 leadership
  if(a.leader==='loud'){ add(['CB','GK'],4); add(['DM'],3); }
  if(a.leader==='keyMoments'){ add(['DM','CB'],2); add(['AM'],1); }
  if(a.leader==='quiet'){ add(['LW','RW','AM'],2); }
  if(a.leader==='soloFocus'){ add(['CF','LW','RW'],2); }

  // 3 risk in build-up
  if(a.risk==='killerPass'){ add(['AM'],4); add(['RB'],2); }
  if(a.risk==='safe'){ add(['DM','CB'],4); }
  if(a.risk==='situational'){ add(['DM','AM','CB'],2); }

  // 4 pressing intensity
  if(a.press==='instant'){ add(['CF','AM'],3); add(['LW','RW'],2); }
  if(a.press==='waitClose'){ add(['CB','DM'],3); add(['LB','RB'],2); }
  if(a.press==='coverSpace'){ add(['CB','DM'],4); add(['GK'],2); }
  if(a.press==='saveEnergy'){ add(['CF'],3); add(['GK'],1); }

  // 5 set-piece role
  if(a.setpiece==='taker'){ add(['AM'],4); add(['RB','LB'],2); }
  if(a.setpiece==='boxScorer'){ add(['CF','CB'],4); }
  if(a.setpiece==='stayBack'){ add(['DM','CB','GK'],3); }

  // 6 reaction to losing the ball

  if(a.lostBall==='closeSpace'){ add(['DM','CB'],3); }

  // 7 free positioning
  if(a.standPos==='halfSpace'){ add(['AM'],5); add(['CF'],2); }
  if(a.standPos==='wide'){ add(['LW','RW'],5); add(['LB','RB'],2); }
  if(a.standPos==='deep'){ add(['DM','CB'],5); add(['GK'],2); }
  if(a.standPos==='inBox'){ add(['CF'],6); }

  // 8 where goals come from
  if(a.boxGoal==='nearPost'){ add(['CF'],4); add(['CB'],1); }
  if(a.boxGoal==='farPost'){ add(['CF'],3); add(['LW','RW'],2); }
  if(a.boxGoal==='cutback'){ add(['AM'],3); add(['LW','RW'],2); }
  if(a.boxGoal==='instinct'){ add(['CF'],4); }

  // 9 counter-attack role
  if(a.counter==='firstPass'){ add(['DM','CB'],4); add(['GK'],2); }
  if(a.counter==='carry'){ add(['LW','RW'],4); add(['AM'],2); }
  if(a.counter==='lateRun'){ add(['AM'],4); add(['CF'],2); }
  if(a.counter==='balance'){ add(['DM','CB'],4); add(['LB','RB'],2); }

  // 10 tempo control
  if(a.tempo==='speedUp'){ add(['LW','RW','CF'],3); }
  if(a.tempo==='slowDown'){ add(['DM'],4); add(['CB'],2); }
  if(a.tempo==='adapt'){ add(['AM','DM'],3); }
  if(a.tempo==='notMine'){ add(['CF','CB','GK'],2); }

  // 11 body shape before receiving
  if(a.bodyShape==='openUp'){ add(['AM','DM'],3); add(['LB','RB'],2); }
  if(a.bodyShape==='backToGoal'){ add(['CF'],5); }
  if(a.bodyShape==='halfTurn'){ add(['AM','DM'],4); add(['CB'],2); }
  if(a.bodyShape==='whatever'){ add(['GK','CB'],2); }

  // 12 1v1 vs a better opponent
  if(a.duelPro==='fight'){ add(['CB'],4); add(['DM'],2); }
  if(a.duelPro==='keepDistance'){ add(['CB','LB','RB'],3); }
  if(a.duelPro==='callHelp'){ add(['LB','RB','DM'],2); }
  if(a.duelPro==='readHim'){ add(['CB','DM'],4); add(['GK'],2); }

  // 13 communication with the goalkeeper
  if(a.gkComm==='alot'){ add(['CB'],4); add(['LB','RB'],2); }
  if(a.gkComm==='sometimes'){ add(['DM','CB'],2); }
  if(a.gkComm==='rarely'){ add(['AM','LW','RW'],2); }
  if(a.gkComm==='tooFar'){ add(['CF'],4); add(['LW','RW'],2); }
  if(a.gkComm==='iAmGk'){ add(['GK'],12); }

  // 14 reaction after conceding
  if(a.conceded==='rally'){ add(['CB','GK','DM'],3); }
  if(a.conceded==='focus'){ add(['CB','DM'],2); add(['GK'],1); }
  if(a.conceded==='chase'){ add(['CF','AM'],3); add(['LW','RW'],2); }
  if(a.conceded==='deflate'){ add(['LW','RW'],1); }

  // 15 most satisfying moment
  if(a.bestMoment==='scoring'){ add(['CF'],5); add(['LW','RW'],2); }
  if(a.bestMoment==='assist'){ add(['AM'],5); add(['LB','RB'],2); }
  if(a.bestMoment==='tackle'){ add(['CB','DM'],5); add(['LB','RB'],2); }
  if(a.bestMoment==='save'){ add(['GK'],10); }

  // 16 defensive awareness
  if(a.awareness==='holdShape'){ add(['CB','DM'],4); }
  if(a.awareness==='markMan'){ add(['CB','LB','RB'],3); }
  if(a.awareness==='coverGap'){ add(['DM','CB'],4); add(['GK'],2); }
  if(a.awareness==='stayForward'){ add(['CF','LW','RW'],4); }

  // 17 self-declared weakness (scores the positions least punished by it)
  if(a.weakness==='slow'){ add(['CF','CB','DM','GK'],2); }
  if(a.weakness==='weakDuel'){ add(['LW','RW','AM'],2); }
  if(a.weakness==='slowDecision'){ add(['CF','CB','GK'],2); }
  if(a.weakness==='weakAir'){ add(['LW','RW','AM','DM','LB','RB'],2); }

  // 18 where they actually play (zone picker) — the heaviest single signal
  const zb = zoneScores(a.currentZone);
  POS.forEach(p=>s[p] += zb[p]);

  // 19 favourite position (aspirational, light weight)
  if(a.favPro) add([a.favPro], a.favPro==='GK' ? 4 : 3);

  // physical brackets stay a small tie-breaker, same as the quick test
  const bonus = physicalBonus();
  POS.forEach(p=>s[p] += bonus[p]);

  return s;
}

function proRanked(){
  const raw = computeProScores();
  return POS.slice().sort((a,b)=>{
    if(raw[b] !== raw[a]) return raw[b] - raw[a];
    if(a === state.answers.favPro) return -1;
    if(b === state.answers.favPro) return 1;
    return POS.indexOf(a) - POS.indexOf(b);
  });
}

/* every position best-first; ties broken by the user's own favourite */
function ranked(){
  const raw = computeScores();
  return POS.slice().sort((a,b)=>{
    if(raw[b] !== raw[a]) return raw[b] - raw[a];
    if(a === state.answers.fav) return -1;
    if(b === state.answers.fav) return 1;
    return POS.indexOf(a) - POS.indexOf(b);
  });
}

/* kept for the tie-aware view: every position on the top score */
function score(){
  const raw = computeScores();
  const max = Math.max(...POS.map(p=>raw[p]));
  return POS.filter(p=>raw[p]===max);
}

  const idx = STAGE_OF[id] ?? 0;
  $$('.stagedot').forEach(d=>{
    const i = +d.dataset.stage;
    d.classList.toggle('done', i < idx);
    d.classList.toggle('now', i === idx);
  });

  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');

  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ---- lightweight on-device biometric unlock (WebAuthn platform authenticator) ---- */
const BIO_SUPPORTED = !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }

function afterAuth(){
  const saved = BIO_SUPPORTED ? localStorage.getItem('nigj_bio') : null;
  const savedPhone = saved ? JSON.parse(saved).phone : null;
  if(BIO_SUPPORTED && savedPhone !== state.phone){
    showStep('step-biometric');
  } else {
    routeAfterAuth();
  }
}

async function routeAfterAuth(){
  if(pendingBattleId){
    const handled = await checkPendingBattle();
    if(handled) return;
  }
  if(state.phone === ADMIN_PHONE){
    showScreen('s-admin');
    const count = await fetchSignupCount();
    $('#admin-count').textContent = (count === null) ? '—' : String(count);
  } else {
    showScreen('s-welcome');
  }
}
$('#admin-continue').onclick = ()=>showScreen('s-welcome');

$('#bio-enable').onclick = async ()=>{
  try{
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'NIGJ' },
      user: { id: new TextEncoder().encode(state.phone), name: state.phone, displayName: state.phone },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000
    }});
    localStorage.setItem('nigj_bio', JSON.stringify({ phone: state.phone, id: b64(cred.rawId) }));
  }catch(e){ console.warn('biometric enroll failed/cancelled', e); }
  routeAfterAuth();
};
$('#bio-skip').onclick = ()=> routeAfterAuth();

async function tryBiometricLogin(){
  if(!BIO_SUPPORTED) return;
  const saved = localStorage.getItem('nigj_bio');
  if(!saved) return;
  const { phone, id } = JSON.parse(saved);
  $('#bio-login').style.display = '';
  $('#bio-login').onclick = async ()=>{
    try{
      await navigator.credentials.get({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type:'public-key', id: unb64(id) }],
        userVerification: 'required',
        timeout: 60000
      }});
      state.phone = phone;
      routeAfterAuth();
    }catch(e){ console.warn('biometric login failed/cancelled', e); }
  };
}

/* ---------- draggable / resizable pitch zone ---------- */
let zoneState = null;
function initZonePicker(){
  const wrap = $('#zonewrap'), boxEl = $('#zonebox');
  const saved = state.answers.currentZone;
  const R = () => wrap.getBoundingClientRect();

  // default: a mid-sized box in the centre, or whatever they picked before
  let z = saved ? {...saved} : {cx:0.5, cy:0.5, w:0.42, h:0.26};
  const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

  function paint(){
    z.w = clamp(z.w, 0.12, 1); z.h = clamp(z.h, 0.10, 1);
    z.cx = clamp(z.cx, z.w/2, 1 - z.w/2);
    z.cy = clamp(z.cy, z.h/2, 1 - z.h/2);
    boxEl.style.left   = ((z.cx - z.w/2) * 100) + '%';
    boxEl.style.top    = ((z.cy - z.h/2) * 100) + '%';
    boxEl.style.width  = (z.w * 100) + '%';
    boxEl.style.height = (z.h * 100) + '%';
  }
  paint();
  zoneState = z;

  function drag(e, mode){
    e.preventDefault(); e.stopPropagation();
    const r = R();
    const start = ('touches' in e && e.touches[0]) ? e.touches[0] : e;
    const sx = start.clientX, sy = start.clientY;
    const z0 = {...z};

    function move(ev){
      const pt = ('touches' in ev && ev.touches[0]) ? ev.touches[0] : ev;
      const dx = (pt.clientX - sx) / r.width;
      const dy = (pt.clientY - sy) / r.height;
      if(mode === 'move'){
        z.cx = z0.cx + dx; z.cy = z0.cy + dy;
      } else {
        // resize from a corner, growing/shrinking around the centre
        z.w = z0.w + (mode === 'tl' ? -dx : dx) * 2;
        z.h = z0.h + (mode === 'tl' ? -dy : dy) * 2;
      }
      paint();
      ev.preventDefault();
    }
    function up(){
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    }
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', up);
  }

  boxEl.onpointerdown = e => { if(!e.target.classList.contains('zhandle')) drag(e,'move'); };
  $('#zh-tl').onpointerdown = e => drag(e,'tl');
  $('#zh-br').onpointerdown = e => drag(e,'br');
}

  state.answers.currentZone = {...zoneState};

/* ---------- professional-test explanation: references their actual answers ---------- */
function proFrag(qid, map){
  const v = state.answers[qid];
  return (map && map[v]) || '';
}

function explainPro(main, alt){
  const a = state.answers, P = T[lang].pos;
  const L = (fa, en) => (lang === 'fa' ? fa : en);
  const bits = [];

  const z = a.currentZone;
  if(z){
    const vert = z.cy < 0.30 ? L('بالای زمین، نزدیک دروازه حریف','high up the pitch, near their goal')
      : z.cy < 0.50 ? L('تو یک‌سوم هجومی','in the attacking third')
      : z.cy < 0.72 ? L('وسط زمین','through the middle of the pitch')
      : L('عقب زمین، نزدیک دروازه خودی','deep, close to your own goal');
    const horiz = z.cx < 0.32 ? L('سمت چپ','on the left')
      : z.cx > 0.68 ? L('سمت راست','on the right')
      : L('تو محور مرکزی','down the central channel');
    const span = (z.w > 0.55 || z.h > 0.55) ? L('و منطقه وسیعی رو پوشش می‌دی','covering a wide area')
      : L('و روی یه منطقه مشخص متمرکزی','staying focused on one clear zone');
    bits.push(L(
      `خودت گفتی ${vert} و ${horiz} بازی می‌کنی ${span}.`,
      `You told us you play ${vert}, ${horiz}, ${span}.`));
  }

  const touch = proFrag('touch', L(
    {intoSpace:'لمس اولت رو می‌بری تو فضا و حرکت می‌کنی', holdIt:'توپ رو نگه می‌داری تا تیم بیاد بالا',
     oneTouch:'یه‌ضرب بازی می‌کنی', shootIt:'سریع شوت یا سانتر می‌زنی'},
    {intoSpace:'your first touch goes into space', holdIt:'you hold the ball up for the team',
     oneTouch:'you play one-touch', shootIt:'you shoot or cross straight away'}));

  const press = proFrag('press', L(
    {instant:'فوری پرس می‌گیری', waitClose:'صبر می‌کنی حریف نزدیک بشه',
     coverSpace:'به‌جای پرس، فضا رو می‌پوشونی', saveEnergy:'انرژیت رو نگه می‌داری'},
    {instant:'you press instantly', waitClose:'you wait for them to come close',
     coverSpace:'you cover space instead of pressing', saveEnergy:'you conserve your energy'}));

  const risk = proFrag('risk', L(
    {killerPass:'ریسک پاس کلیدی رو می‌پذیری', safe:'بازی امن و حفظ توپ رو ترجیح می‌دی',
     situational:'بسته به موقعیت تصمیم می‌گیری', longEarly:'زود با پاس بلند می‌رسونی جلو'},
    {killerPass:'you take the risk on a killer pass', safe:'you prefer safe possession',
     situational:'you decide based on the situation', longEarly:'you go long and early'}));

  const parts = [touch, press, risk].filter(Boolean);
  if(parts.length){
    const last = parts.pop();
    const joined = parts.length
      ? parts.join(L('، ', ', ')) + L(' و ', ', and ') + last
      : last;
    bits.push(joined + '.');
  }

  const best = proFrag('bestMoment', L(
    {scoring:'بیشترین لذتت از گل زدنه', assist:'بیشترین لذتت از پاس گله',
     tackle:'بیشترین لذتت از یه تکل سرنوشت‌سازه', save:'بیشترین لذتت از یه سیو حیاتیه'},
    {scoring:'scoring gives you the biggest buzz', assist:'the assist gives you the biggest buzz',
     tackle:'a decisive tackle gives you the biggest buzz', save:'a vital save gives you the biggest buzz'}));
  if(best) bits.push(best + '.');

  bits.push(L(
    `همه اینا با هم — جای ایستادنت، تصمیم‌هات زیر فشار و چیزی که ازش لذت می‌بری — دقیقاً به ${P[main]} می‌خوره. اگه یه روز خواستی نقش دیگه‌ای رو امتحان کنی، ${P[alt]} نزدیک‌ترین گزینه‌ته.`,
    `All of it together — where you stand, how you decide under pressure, and what you enjoy most — points to ${P[main]}. If you ever want a different role, ${P[alt]} is your closest fit.`));

  return bits.join(' ');
}

function growthTipPro(main){
  const a = state.answers, P = T[lang].pos, L = TRAITS[lang] || TRAITS.en;
  const weakMap = {slow:'speed', weakDuel:'power', slowDecision:'vision', weakAir:'jump'};
  const wanted = POS_TRAITS[main] || [];
  const picks = [];
  if(a.weakness && weakMap[a.weakness]) picks.push(weakMap[a.weakness]);
  wanted.forEach(x=>{ if(picks.length < 2 && !picks.includes(x) && !hasTrait(x)) picks.push(x); });
  while(picks.length < 2) picks.push(picks.includes('vision') ? 'stamina' : 'vision');
  return t('result.growTwo').replace('{pos}', P[main]).replace('{a}', L[picks[0]]).replace('{b}', L[picks[1]]);
}

/* =========================================================
   CARD MAKER — draw an original football-style card on canvas
========================================================= */
const CARD_POS = ['ST','CF','LW','RW','CAM','CM','CDM','LB','RB','CB','GK'];
const CARD_STATS = ['PAC','SHO','PAS','DRI','DEF','PHY'];

const CARD_STYLES = {
  classic: {
    key:'classic',
    bg:['#E9EEF2','#B9C6D1','#8FA0AE'], ink:'#16222C', accent:'#5A6E7E',
    line:'rgba(22,34,44,.35)', banner:'rgba(22,34,44,.10)', ornament:'triangles'
  },
  legend: {
    key:'legend',
    bg:['#FFF3C4','#E9C04A','#B8862A'], ink:'#3A2606', accent:'#7A5410',
    line:'rgba(58,38,6,.35)', banner:'rgba(58,38,6,.12)', ornament:'rays'
  },
  worldcup: {
    key:'worldcup',
    bg:['#7A1338','#4E0C25','#2A0715'], ink:'#FFF6E9', accent:'#39C4A8',
    line:'rgba(57,196,168,.5)', banner:'rgba(255,246,233,.10)', ornament:'triangles'
  },
  goldenball: {
    key:'goldenball',
    bg:['#2A2418','#151208','#000000'], ink:'#F6DFA0', accent:'#D9B14A',
    line:'rgba(217,177,74,.55)', banner:'rgba(217,177,74,.12)', ornament:'rays'
  },
  champions: {
    key:'champions',
    bg:['#1B3FA8','#0E2association','#061436'], ink:'#EAF1FF', accent:'#7FB2FF',
    line:'rgba(127,178,255,.5)', banner:'rgba(234,241,255,.10)', ornament:'stars'
  }
};
CARD_STYLES.champions.bg = ['#1B3FA8','#0E2467','#061436'];

const cardState = {
  name: '', pos: 'ST', style: 'legend',
  stats: {PAC:78, SHO:75, PAS:72, DRI:80, DEF:45, PHY:70},
  photo: null   // an Image once cropped
};

function cardOVR(){
  const v = CARD_STATS.map(k=>cardState.stats[k]);
  return Math.round(v.reduce((a,b)=>a+b,0) / v.length);
}

function roundRectPath(x, ctx, X, Y, W, H, R){
  ctx.beginPath();
  ctx.moveTo(X+R, Y);
  ctx.lineTo(X+W-R, Y); ctx.quadraticCurveTo(X+W, Y, X+W, Y+R);
  ctx.lineTo(X+W, Y+H-R); ctx.quadraticCurveTo(X+W, Y+H, X+W-R, Y+H);
  ctx.lineTo(X+R, Y+H); ctx.quadraticCurveTo(X, Y+H, X, Y+H-R);
  ctx.lineTo(X, Y+R); ctx.quadraticCurveTo(X, Y, X+R, Y);
  ctx.closePath();
}

/* the card silhouette: a rounded shield that tapers to a point at the bottom */
function shieldPath(ctx, X, Y, W, H){
  const r = W*0.07;
  ctx.beginPath();
  ctx.moveTo(X+r, Y);
  ctx.lineTo(X+W-r, Y);
  ctx.quadraticCurveTo(X+W, Y, X+W, Y+r);
  ctx.lineTo(X+W, Y+H*0.86);
  ctx.quadraticCurveTo(X+W, Y+H*0.90, X+W-W*0.09, Y+H*0.935);
  ctx.lineTo(X+W*0.55, Y+H);
  ctx.quadraticCurveTo(X+W*0.5, Y+H*1.012, X+W*0.45, Y+H);
  ctx.lineTo(X+W*0.09, Y+H*0.935);
  ctx.quadraticCurveTo(X, Y+H*0.90, X, Y+H*0.86);
  ctx.lineTo(X, Y+r);
  ctx.quadraticCurveTo(X, Y, X+r, Y);
  ctx.closePath();
}

function drawOrnaments(ctx, st, X, Y, W, H){
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = st.ink;
  if(st.ornament === 'triangles'){
    for(let i=0;i<26;i++){
      const px = X + Math.random()*W, py = Y + Math.random()*H*0.9, sz = 10 + Math.random()*16;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+sz, py); ctx.lineTo(px+sz/2, py+sz*0.9);
      ctx.closePath(); ctx.fill();
    }
  } else if(st.ornament === 'stars'){
    for(let i=0;i<22;i++){
      const px = X + Math.random()*W, py = Y + Math.random()*H*0.9, R = 6 + Math.random()*10;
      ctx.beginPath();
      for(let k=0;k<5;k++){
        const a1 = -Math.PI/2 + k*2*Math.PI/5, a2 = a1 + Math.PI/5;
        ctx.lineTo(px+Math.cos(a1)*R, py+Math.sin(a1)*R);
        ctx.lineTo(px+Math.cos(a2)*R*0.45, py+Math.sin(a2)*R*0.45);
      }
      ctx.closePath(); ctx.fill();
    }
  } else { // rays
    ctx.translate(X+W/2, Y+H*0.30);
    for(let i=0;i<10;i++){
      ctx.rotate(Math.PI*2/10);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(W*0.9, -W*0.045); ctx.lineTo(W*0.9, W*0.045);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

async function drawCard(){
  if(typeof drawCardBack === 'function') setTimeout(drawCardBack, 0);
  const cv = $('#card-canvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const st = CARD_STYLES[cardState.style] || CARD_STYLES.legend;
  try{ await document.fonts.ready; }catch(e){}

  ctx.clearRect(0,0,W,H);

  // outer white frame
  const M = W*0.045;
  ctx.save();
  shieldPath(ctx, M*0.5, M*0.5, W-M, H-M*1.4);
  ctx.fillStyle = st.key === 'worldcup' || st.key === 'goldenball' || st.key === 'champions'
    ? 'rgba(255,255,255,.92)' : '#FFFFFF';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fill();
  ctx.restore();

  // inner body
  const IX = M*1.35, IY = M*1.35, IW = W - M*2.7, IH = H - M*3.1;
  ctx.save();
  shieldPath(ctx, IX, IY, IW, IH);
  ctx.clip();

  const g = ctx.createLinearGradient(IX, IY, IX+IW*0.4, IY+IH);
  g.addColorStop(0, st.bg[0]); g.addColorStop(.55, st.bg[1]); g.addColorStop(1, st.bg[2]);
  ctx.fillStyle = g; ctx.fillRect(IX, IY, IW, IH);

  drawOrnaments(ctx, st, IX, IY, IW, IH);

  // Player photo. Framed the way real cards do it: the figure sits in the
  // upper area, centred in the space right of the OVR column, and its bottom
  // always lands on the name banner — never over it. Size is capped so a
  // tight face crop doesn't turn into a giant head.
  if(cardState.photo){
    const cut = !!cardState.cutout;
    const src = cut ? cardState.cutout : getFeathered();

    const areaTop    = IY + IH*0.055;
    const areaBottom = IY + IH*0.610;          // exactly the top of the name banner
    const areaLeft   = IX + IW*0.20;
    const areaRight  = IX + IW*0.98;
    const areaW = areaRight - areaLeft;
    const areaH = areaBottom - areaTop;

    // fit inside the area, then cap so wide/square crops stay sensible
    let scale = Math.min(areaW/src.width, areaH/src.height);
    const maxW = IW*(cut ? 0.60 : 0.70);
    const maxH = IH*(cut ? 0.56 : 0.545);
    scale = Math.min(scale, maxW/src.width, maxH/src.height);

    const dw = src.width*scale, dh = src.height*scale;
    const dx = areaLeft + (areaW - dw)/2 + IW*0.03;   // nudged right, clear of the OVR
    const dy = areaBottom - dh;                        // shoulders meet the banner

    ctx.save();
    // hard clip: nothing can ever spill onto the banner or the stats
    ctx.beginPath();
    ctx.rect(IX, IY, IW, areaBottom - IY);
    ctx.clip();
    if(cut){
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = IW*0.05; ctx.shadowOffsetY = IW*0.012;
    }
    ctx.drawImage(src, dx, dy, dw, dh);
    ctx.restore();
  }

  // left column: OVR + position
  ctx.textAlign = 'center';
  ctx.fillStyle = st.ink;
  ctx.font = `900 ${Math.round(IW*0.235)}px Anton, Vazirmatn, sans-serif`;
  const colX = IX + IW*0.185;
  ctx.fillText(String(cardOVR()), colX, IY + IH*0.175);
  ctx.font = `700 ${Math.round(IW*0.098)}px Anton, Vazirmatn, sans-serif`;
  ctx.fillText(cardState.pos, colX, IY + IH*0.235);

  // small divider under the position
  ctx.strokeStyle = st.line; ctx.lineWidth = Math.max(2, IW*0.006);
  ctx.beginPath();
  ctx.moveTo(colX - IW*0.07, IY + IH*0.263); ctx.lineTo(colX + IW*0.07, IY + IH*0.263);
  ctx.stroke();

  // name banner
  const nameY = IY + IH*0.655;
  ctx.fillStyle = st.banner;
  ctx.fillRect(IX + IW*0.06, nameY - IH*0.045, IW*0.88, IH*0.075);
  ctx.fillStyle = st.ink;
  const nm = (cardState.name || '').trim().toUpperCase() || 'YOUR NAME';
  let fs = Math.round(IW*0.115);
  ctx.font = `900 ${fs}px Anton, Vazirmatn, sans-serif`;
  while(ctx.measureText(nm).width > IW*0.82 && fs > 26){
    fs -= 3; ctx.font = `900 ${fs}px Anton, Vazirmatn, sans-serif`;
  }
  ctx.fillText(nm, IX + IW/2, nameY + IH*0.012);

  // stats, two columns of three
  const sx1 = IX + IW*0.30, sx2 = IX + IW*0.72;
  const sy0 = IY + IH*0.745, dy = IH*0.062;
  ctx.font = `700 ${Math.round(IW*0.072)}px Anton, Vazirmatn, sans-serif`;
  CARD_STATS.forEach((k,i)=>{
    const col = i < 3 ? sx1 : sx2;
    const row = i < 3 ? i : i-3;
    const y = sy0 + row*dy;
    ctx.textAlign = 'right';
    ctx.fillStyle = st.ink;
    ctx.fillText(String(cardState.stats[k]), col - IW*0.015, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = st.accent;
    ctx.fillText(k, col + IW*0.015, y);
  });

  // centre divider between the two stat columns
  ctx.strokeStyle = st.line; ctx.lineWidth = Math.max(1.5, IW*0.004);
  ctx.beginPath();
  ctx.moveTo(IX + IW*0.505, sy0 - IH*0.045);
  ctx.lineTo(IX + IW*0.505, sy0 + dy*2 + IH*0.018);
  ctx.stroke();

  // brand
  ctx.textAlign = 'center';
  ctx.fillStyle = st.accent;
  ctx.font = `700 ${Math.round(IW*0.05)}px Anton, Vazirmatn, sans-serif`;
  ctx.fillText('NIGJ', IX + IW/2, IY + IH*0.945);

  ctx.restore();
}

/* ---------- soft feather: melts the photo into the card, face stays sharp ---------- */
function getFeathered(){
  if(cardState._feather && cardState._featherFor === cardState.photo) return cardState._feather;
  const ph = cardState.photo;
  const c = document.createElement('canvas');
  c.width = ph.width; c.height = ph.height;
  const g = c.getContext('2d');
  g.drawImage(ph, 0, 0);

  g.globalCompositeOperation = 'destination-out';
  const W = c.width, H = c.height, fx = W*0.16, fy = H*0.12;
  [[0,0,fx,0],[W,0,W-fx,0],[0,0,0,fy],[0,H,0,H-fy]].forEach(([x0,y0,x1,y1])=>{
    const grad = g.createLinearGradient(x0,y0,x1,y1);
    grad.addColorStop(0,'rgba(0,0,0,1)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0,0,W,H);
  });
  g.globalCompositeOperation = 'source-over';

  cardState._feather = c; cardState._featherFor = cardState.photo;
  return c;
}

/* ---------- smart background removal (MediaPipe selfie segmentation) ---------- */
let cutoutBusy = false;
async function smartCutout(opts){
  const auto = !!(opts && opts.auto);
  if(!cardState.photo || cutoutBusy) return;
  cutoutBusy = true;
  const btn = $('#card-cutout');
  if(btn){ btn.disabled = true; btn.textContent = t('card.cutoutWorking'); }
  try{
    const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const mod = await import(CDN);
    const vision = await mod.FilesetResolver.forVisionTasks(CDN + '/wasm');
    const seg = await mod.ImageSegmenter.createFromOptions(vision, {
      baseOptions:{ modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite' },
      runningMode:'IMAGE', outputCategoryMask:true, outputConfidenceMasks:false
    });

    const ph = cardState.photo;
    const res = seg.segment(ph);
    const cm = res.categoryMask;
    const mw = cm.width, mh = cm.height;
    const raw = cm.getAsUint8Array();

    const mcv = document.createElement('canvas');
    mcv.width = mw; mcv.height = mh;
    const mctx = mcv.getContext('2d');
    const idata = mctx.createImageData(mw, mh);

    // Which label means "person"? Don't assume — sample the middle of the
    // frame, which in a cropped portrait is overwhelmingly the person, and
    // take whichever label dominates there. Works whichever way round the
    // model numbers its classes.
    const cx0 = Math.floor(mw*0.32), cx1 = Math.ceil(mw*0.68);
    const cy0 = Math.floor(mh*0.12), cy1 = Math.ceil(mh*0.62);
    const centre = {};
    for(let y=cy0; y<cy1; y++){
      for(let x=cx0; x<cx1; x++){
        const v = raw[y*mw + x];
        centre[v] = (centre[v] || 0) + 1;
      }
    }
    let personVal = 0, best = -1;
    Object.keys(centre).forEach(k=>{ if(centre[k] > best){ best = centre[k]; personVal = +k; } });

    let personCount = 0;
    for(let i=0;i<mw*mh;i++){
      const isPerson = raw[i] === personVal;
      if(isPerson) personCount++;
      idata.data[i*4] = 255; idata.data[i*4+1] = 255; idata.data[i*4+2] = 255;
      idata.data[i*4+3] = isPerson ? 255 : 0;
    }

    // Safety net: a sane portrait cutout keeps somewhere between 8% and 85%
    // of the frame. Anything outside that means the mask is wrong, so we keep
    // the untouched photo rather than showing a broken card.
    const kept = personCount / (mw*mh);
    if(kept < 0.08 || kept > 0.85){
      throw new Error('implausible mask coverage: ' + kept.toFixed(3));
    }
    mctx.putImageData(idata, 0, 0);

    // erode the mask by one pixel: keeps a hard, clean edge with no
    // leftover halo of background colour around the head and shoulders
    const eroded = document.createElement('canvas');
    eroded.width = mw; eroded.height = mh;
    const ectx = eroded.getContext('2d');
    ectx.drawImage(mcv, 0, 0);
    ectx.globalCompositeOperation = 'destination-in';
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>ectx.drawImage(mcv, dx, dy));
    ectx.globalCompositeOperation = 'source-over';
    try{ cm.close(); if(res.close) res.close(); }catch(e){}
    seg.close();

    // blur the mask alone, in plain source-over — no composite tricks yet
    const softMask = document.createElement('canvas');
    softMask.width = ph.width; softMask.height = ph.height;
    const sctx = softMask.getContext('2d');
    sctx.filter = 'blur(' + Math.max(1, Math.round(ph.width/700)) + 'px)';
    sctx.drawImage(eroded, 0, 0, ph.width, ph.height);
    sctx.filter = 'none';

    // now cut the photo with that finished mask — one clean operation
    const out = document.createElement('canvas');
    out.width = ph.width; out.height = ph.height;
    const octx = out.getContext('2d');
    octx.drawImage(ph, 0, 0);
    octx.globalCompositeOperation = 'destination-in';
    octx.drawImage(softMask, 0, 0);
    octx.globalCompositeOperation = 'source-over';

    // final sanity check: after blur+trim, does an actual silhouette survive?
    // (guards against any remaining edge case producing a blank or full mask)
    const checkData = octx.getImageData(0, 0, out.width, out.height).data;
    let opaque = 0;
    for(let i=3; i<checkData.length; i+=4*37){ if(checkData[i] > 200) opaque++; }
    const sampleTotal = Math.ceil(checkData.length / (4*37));
    const opaqueRatio = opaque / sampleTotal;
    if(opaqueRatio < 0.06 || opaqueRatio > 0.90){
      throw new Error('final cutout implausible: ' + opaqueRatio.toFixed(3));
    }

    cardState.cutout = trimTransparent(out);
    drawCard();
    if(!auto) toast(t('card.cutoutDone'));
  }catch(e){
    console.warn('cutout failed', e);
    if(!auto) toast(t('card.cutoutFail'));
  }finally{
    cutoutBusy = false;
    if(btn) btn.disabled = false;
    updateCutoutBtn();
  }
}

function trimTransparent(cv){
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const d = g.getImageData(0,0,W,H).data;
  let minX=W, minY=H, maxX=0, maxY=0, found=false;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      if(d[(y*W+x)*4+3] > 12){
        found = true;
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
  }
  if(!found) return cv;
  const pad = Math.round(Math.min(W,H)*0.02);
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(W-1,maxX+pad); maxY=Math.min(H-1,maxY+pad);
  const w = maxX-minX+1, h = maxY-minY+1;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(cv, minX, minY, w, h, 0, 0, w, h);
  return out;
}

/* ---------- the back of the card ---------- */
async function drawCardBack(){
  const cv = $('#card-back-canvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const st = CARD_STYLES[cardState.style] || CARD_STYLES.legend;
  try{ await document.fonts.ready; }catch(e){}
  ctx.clearRect(0,0,W,H);

  const M = W*0.045;
  ctx.save();
  shieldPath(ctx, M*0.5, M*0.5, W-M, H-M*1.4);
  ctx.fillStyle = '#FFFFFF';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fill();
  ctx.restore();

  const IX = M*1.35, IY = M*1.35, IW = W - M*2.7, IH = H - M*3.1;
  ctx.save();
  shieldPath(ctx, IX, IY, IW, IH);
  ctx.clip();

  const g = ctx.createLinearGradient(IX, IY+IH, IX+IW, IY);
  g.addColorStop(0, st.bg[2]); g.addColorStop(.5, st.bg[1]); g.addColorStop(1, st.bg[0]);
  ctx.fillStyle = g; ctx.fillRect(IX, IY, IW, IH);

  // a quiet repeating monogram pattern
  ctx.save();
  ctx.globalAlpha = .09; ctx.fillStyle = st.ink;
  ctx.font = `700 ${Math.round(IW*0.075)}px Anton, Vazirmatn, sans-serif`;
  ctx.textAlign = 'center';
  for(let r=0;r<9;r++){
    for(let c=0;c<4;c++){
      ctx.fillText('NIGJ', IX + IW*(0.16 + c*0.24), IY + IH*(0.10 + r*0.095));
    }
  }
  ctx.restore();

  // centre badge
  const cxp = IX + IW/2, cyp = IY + IH*0.42, R = IW*0.27;
  ctx.beginPath(); ctx.arc(cxp, cyp, R, 0, Math.PI*2);
  ctx.fillStyle = st.banner; ctx.fill();
  ctx.strokeStyle = st.accent; ctx.lineWidth = Math.max(3, IW*0.012); ctx.stroke();

  const logo = document.querySelector('.brand .logo-mark');
  if(logo && logo.complete){
    ctx.save();
    ctx.beginPath(); ctx.arc(cxp, cyp, R*0.82, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(logo, cxp - R*0.82, cyp - R*0.82, R*1.64, R*1.64);
    ctx.restore();
  } else {
    ctx.fillStyle = st.ink; ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(IW*0.16)}px Anton, Vazirmatn, sans-serif`;
    ctx.fillText('NIGJ', cxp, cyp + IW*0.055);
  }

  // name + position + rating on the back
  ctx.textAlign = 'center';
  ctx.fillStyle = st.ink;
  const nm = (cardState.name || '').trim().toUpperCase() || 'YOUR NAME';
  let fs = Math.round(IW*0.10);
  ctx.font = `900 ${fs}px Anton, Vazirmatn, sans-serif`;
  while(ctx.measureText(nm).width > IW*0.78 && fs > 24){
    fs -= 3; ctx.font = `900 ${fs}px Anton, Vazirmatn, sans-serif`;
  }
  ctx.fillText(nm, cxp, IY + IH*0.755);

  ctx.fillStyle = st.accent;
  ctx.font = `700 ${Math.round(IW*0.072)}px Anton, Vazirmatn, sans-serif`;
  ctx.fillText(`${cardState.pos}  ·  ${cardOVR()} OVR`, cxp, IY + IH*0.815);

  ctx.strokeStyle = st.line; ctx.lineWidth = Math.max(2, IW*0.005);
  ctx.beginPath();
  ctx.moveTo(IX + IW*0.30, IY + IH*0.855); ctx.lineTo(IX + IW*0.70, IY + IH*0.855);
  ctx.stroke();

  ctx.fillStyle = st.accent;
  ctx.font = `700 ${Math.round(IW*0.045)}px Anton, Vazirmatn, sans-serif`;
  ctx.fillText('FIND THE BEST POSITION', cxp, IY + IH*0.905);

  ctx.restore();
}
