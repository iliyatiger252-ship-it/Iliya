/* draws any card payload {name,pos,stats,style,ovr,photo} onto a plain canvas —
   used for the wait/intro/arena previews, which show a friend's card we never
   built interactively ourselves */
function drawStaticCard(canvas, data){
  if(!canvas || !data) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const st = CARD_STYLES[data.style] || CARD_STYLES.legend;
  ctx.clearRect(0,0,W,H);

  const M = W*0.045;
  ctx.save();
  shieldPath(ctx, M*0.5, M*0.5, W-M, H-M*1.4);
  ctx.fillStyle = '#FFFFFF';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 7;
  ctx.fill();
  ctx.restore();

  const IX = M*1.35, IY = M*1.35, IW = W - M*2.7, IH = H - M*3.1;
  ctx.save();
  shieldPath(ctx, IX, IY, IW, IH);
  ctx.clip();
  const g = ctx.createLinearGradient(IX, IY, IX+IW*0.4, IY+IH);
  g.addColorStop(0, st.bg[0]); g.addColorStop(.55, st.bg[1]); g.addColorStop(1, st.bg[2]);
  ctx.fillStyle = g; ctx.fillRect(IX, IY, IW, IH);
  drawOrnaments(ctx, st, IX, IY, IW, IH);

  function finishText(){
    ctx.textAlign = 'center'; ctx.fillStyle = st.ink;
    ctx.font = `900 ${Math.round(IW*0.235)}px Anton, Vazirmatn, sans-serif`;
    const colX = IX + IW*0.185;
    ctx.fillText(String(data.ovr ?? '—'), colX, IY + IH*0.175);
    ctx.font = `700 ${Math.round(IW*0.098)}px Anton, Vazirmatn, sans-serif`;
    ctx.fillText(data.pos || '', colX, IY + IH*0.235);
    ctx.strokeStyle = st.line; ctx.lineWidth = Math.max(2, IW*0.006);
    ctx.beginPath();
    ctx.moveTo(colX - IW*0.07, IY + IH*0.263); ctx.lineTo(colX + IW*0.07, IY + IH*0.263);
    ctx.stroke();
    const nameY = IY + IH*0.655;
    ctx.fillStyle = st.banner;
    ctx.fillRect(IX + IW*0.06, nameY - IH*0.045, IW*0.88, IH*0.075);
    ctx.fillStyle = st.ink;
    const nm = (data.name || '').toUpperCase();
    let fs = Math.round(IW*0.115);
    ctx.font = `900 ${fs}px Anton, Vazirmatn, sans-serif`;
    while(ctx.measureText(nm).width > IW*0.82 && fs > 22){
      fs -= 3; ctx.font = `900 ${fs}px Anton, Vazirmatn, sans-serif`;
    }
    ctx.fillText(nm, IX + IW/2, nameY + IH*0.012);
    const sx1 = IX + IW*0.30, sx2 = IX + IW*0.72;
    const sy0 = IY + IH*0.745, dy = IH*0.062;
    ctx.font = `700 ${Math.round(IW*0.072)}px Anton, Vazirmatn, sans-serif`;
    (data.highlightStat ? CARD_STATS : CARD_STATS).forEach((k,i)=>{
      const col = i < 3 ? sx1 : sx2, row = i < 3 ? i : i-3, y = sy0 + row*dy;
      const hot = data.highlightStat === k;
      ctx.textAlign = 'right';
      ctx.fillStyle = hot ? st.ink : st.ink;
      if(hot){ ctx.save(); ctx.shadowColor = st.accent; ctx.shadowBlur = IW*0.03; }
      ctx.fillText(String(data.stats?.[k] ?? 0), col - IW*0.015, y);
      if(hot) ctx.restore();
      ctx.textAlign = 'left'; ctx.fillStyle = hot ? '#FFFFFF' : st.accent;
      ctx.fillText(k, col + IW*0.015, y);
    });
    ctx.strokeStyle = st.line; ctx.lineWidth = Math.max(1.5, IW*0.004);
    ctx.beginPath();
    ctx.moveTo(IX + IW*0.505, sy0 - IH*0.045);
    ctx.lineTo(IX + IW*0.505, sy0 + dy*2 + IH*0.018);
    ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = st.accent;
    ctx.font = `700 ${Math.round(IW*0.05)}px Anton, Vazirmatn, sans-serif`;
    ctx.fillText('NIGJ', IX + IW/2, IY + IH*0.945);
    ctx.restore();
  }

  if(data.photo){
    const img = new Image();
    img.onload = ()=>{
      const areaTop = IY + IH*0.055, areaBottom = IY + IH*0.610;
      const areaLeft = IX + IW*0.20, areaRight = IX + IW*0.98;
      const areaW = areaRight-areaLeft, areaH = areaBottom-areaTop;
      let scale = Math.min(areaW/img.width, areaH/img.height);
      scale = Math.min(scale, (IW*0.60)/img.width, (IH*0.56)/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      const dx = areaLeft + (areaW-dw)/2 + IW*0.03, dy = areaBottom - dh;
      ctx.save();
      ctx.beginPath(); ctx.rect(IX, IY, IW, areaBottom-IY); ctx.clip();
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
      finishText();
    };
    img.src = data.photo;
  } else {
    finishText();
  }
}

/* ---------- the arena ---------- */
function statLabel(k){ return t('card.statNames.'+k) || k; }

async function startArena(row){
  showScreen('s-battle-arena');
  const mine = iAmChallenger ? row.challenger : row.opponent;
  const theirs = iAmChallenger ? row.opponent : row.challenger;

  $('#arena-left').classList.remove('winner','loser','sanctifying');
  $('#arena-right').classList.remove('winner','loser','sanctifying');
  $('#arena-result').style.display = 'none';
  $('#arena-left-score').textContent = '0';
  $('#arena-right-score').textContent = '0';
  drawStaticCard($('#arena-left-canvas'), mine);
  drawStaticCard($('#arena-right-canvas'), theirs);

  let leftScore = 0, rightScore = 0;
  const flash = document.createElement('div');
  flash.className = 'roundflash'; flash.innerHTML = '<span></span>';
  document.body.appendChild(flash);

  for(const k of CARD_STATS){
    await new Promise(r=>setTimeout(r, 900));
    $('#arena-round-label').textContent = statLabel(k);
    const mv = mine.stats[k] || 0, tv = theirs.stats[k] || 0;
    drawStaticCard($('#arena-left-canvas'), {...mine, highlightStat:k});
    drawStaticCard($('#arena-right-canvas'), {...theirs, highlightStat:k});
    if(mv > tv) leftScore++; else if(tv > mv) rightScore++;
    $('#arena-left-score').textContent = String(leftScore);
    $('#arena-right-score').textContent = String(rightScore);
    flash.querySelector('span').textContent =
      mv===tv ? t('battle.roundTie') : (mv>tv ? t('battle.roundLeft') : t('battle.roundRight'));
    flash.classList.remove('show'); void flash.offsetWidth; flash.classList.add('show');
    if(navigator.vibrate) navigator.vibrate(10);
    await new Promise(r=>setTimeout(r, 700));
  }
  flash.remove();

  await new Promise(r=>setTimeout(r, 300));
  $('#arena-round-label').textContent = '';
  const leftWon = leftScore > rightScore, rightWon = rightScore > leftScore;
  if(leftWon){
    $('#arena-left').classList.add('winner','sanctifying');
    $('#arena-right').classList.add('loser');
  } else if(rightWon){
    $('#arena-right').classList.add('winner','sanctifying');
    $('#arena-left').classList.add('loser');
  }
  if(navigator.vibrate) navigator.vibrate([20,40,20,40,80]);

  const title = leftWon ? t('battle.youWin') : rightWon ? t('battle.youLose') : t('battle.draw');
  $('#arena-result-title').textContent = title;
  $('#arena-result').style.display = '';
}

/* ---------- 3D card: free 360° spin, drag to rotate, glare follows ---------- */
let cardAngleY = 0, cardTiltX = 0;
(function initCard3D(){
  const stage = $('#card-stage'), el = $('#card3d'), shine = $('#card-shine');
  if(!stage || !el) return;
  let raf = null, dragging = false, lastX = 0, lastY = 0, moved = 0;

  function paint(){
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>{
      el.style.transform =
        `rotateY(${cardAngleY.toFixed(2)}deg) rotateX(${cardTiltX.toFixed(2)}deg) translateZ(22px)`;
    });
  }

  function setGlare(px, py){
    if(!shine) return;
    shine.style.setProperty('--gx', (px*100).toFixed(1)+'%');
    shine.style.setProperty('--gy', (py*100).toFixed(1)+'%');
  }

  stage.addEventListener('pointerdown', e=>{
    dragging = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY;
    el.classList.add('grabbing','posed');
    el.classList.remove('spinning');
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  });

  stage.addEventListener('pointermove', e=>{
    const r = stage.getBoundingClientRect();
    setGlare((e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height);
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    cardAngleY += dx * 0.6;                                   // free, unlimited spin
    cardTiltX = Math.max(-22, Math.min(22, cardTiltX - dy*0.25));
    paint();
    e.preventDefault();
  }, {passive:false});

  function endDrag(){
    if(!dragging) return;
    dragging = false;
    el.classList.remove('grabbing');
    // settle to the nearest face and level out the vertical tilt
    cardAngleY = Math.round(cardAngleY/180)*180;
    cardTiltX = 0;
    el.classList.add('spinning');
    paint();
    setTimeout(()=>el.classList.remove('spinning'), 1200);
  }
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev, endDrag));

  // full 360° spin
  $('#card-spin').onclick = ()=>{
    if(navigator.vibrate) navigator.vibrate(12);
    el.classList.add('posed','spinning');
    cardAngleY += 360;
    paint();
    setTimeout(()=>el.classList.remove('spinning'), 1200);
  };

  // half turn: show the other side
  $('#card-flip').onclick = ()=>{
    if(navigator.vibrate) navigator.vibrate(12);
    el.classList.add('posed','spinning');
    cardAngleY += 180;
    paint();
    setTimeout(()=>el.classList.remove('spinning'), 1200);
  };
})();

$('#card-name').addEventListener('input', e=>{ cardState.name = e.target.value; drawCard(); });

/* ---------- photo picking + cropping ---------- */
let cropBoxState = null, cropNaturalImg = null;

$('#pick-photo').onclick = ()=>$('#photo-input').click();

$('#photo-input').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      cropNaturalImg = img;
      $('#crop-img').src = img.src;
      $('#crop-modal').classList.add('open');
      setTimeout(initCropBox, 60);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
  e.target.value = '';
});

function initCropBox(){
  const stage = $('#crop-stage'), boxEl = $('#crop-box');
  let z = {cx:0.5, cy:0.42, w:0.6, h:0.6};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function paint(){
    z.w = clamp(z.w,0.15,1); z.h = clamp(z.h,0.15,1);
    z.cx = clamp(z.cx, z.w/2, 1-z.w/2);
    z.cy = clamp(z.cy, z.h/2, 1-z.h/2);
    boxEl.style.left = ((z.cx-z.w/2)*100)+'%';
    boxEl.style.top = ((z.cy-z.h/2)*100)+'%';
    boxEl.style.width = (z.w*100)+'%';
    boxEl.style.height = (z.h*100)+'%';
  }
  paint(); cropBoxState = z;

  function drag(e, mode){
    e.preventDefault(); e.stopPropagation();
    const r = stage.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, z0 = {...z};
    function move(ev){
      const dx = (ev.clientX - sx)/r.width, dy = (ev.clientY - sy)/r.height;
      if(mode==='move'){ z.cx = z0.cx + dx; z.cy = z0.cy + dy; }
      else {
        z.w = z0.w + (mode==='tl' ? -dx : dx)*2;
        z.h = z0.h + (mode==='tl' ? -dy : dy)*2;
      }
      paint(); ev.preventDefault();
    }
    function up(){
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    }
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
  }
  boxEl.onpointerdown = e => { if(!e.target.classList.contains('zhandle')) drag(e,'move'); };
  $('#crop-tl').onpointerdown = e => drag(e,'tl');
  $('#crop-br').onpointerdown = e => drag(e,'br');
}

$('#crop-cancel').onclick = ()=>$('#crop-modal').classList.remove('open');

$('#crop-ok').onclick = ()=>{
  if(!cropNaturalImg || !cropBoxState) return;
  const z = cropBoxState, img = cropNaturalImg;
  const sw = img.width * z.w, sh = img.height * z.h;
  const sxp = img.width * (z.cx - z.w/2), syp = img.height * (z.cy - z.h/2);
  const out = document.createElement('canvas');
  out.width = Math.round(sw); out.height = Math.round(sh);
  out.getContext('2d').drawImage(img, sxp, syp, sw, sh, 0, 0, out.width, out.height);
  const cropped = new Image();
  cropped.onload = ()=>{
    cardState.photo = cropped;
    cardState.cutout = null; cardState._feather = null;
    updateCutoutBtn(); drawCard();
    smartCutout({auto:true});   // runs silently, no toggle button to babysit
  };
  cropped.src = out.toDataURL('image/png');
  $('#crop-modal').classList.remove('open');
};

/* =========================================================
   SMART CUTOUT — removes the photo background so the player
   sits inside the card instead of a hard rectangle.
   Tries an on-device segmentation model; if it can't load,
   falls back to a soft feathered mask (never blurs the face).
========================================================= */
let segModel = null, segLoadTried = false;

function loadScriptOnce(src, timeout){
  return new Promise((resolve, reject)=>{
    const done = (ok)=>{ clearTimeout(tm); ok ? resolve() : reject(new Error('load failed')); };
    const tm = setTimeout(()=>done(false), timeout || 9000);
    const el = document.createElement('script');
    el.src = src; el.async = true;
    el.onload = ()=>done(true);
    el.onerror = ()=>done(false);
    document.head.appendChild(el);
  });
}

async function getSegModel(){
  if(segModel || segLoadTried) return segModel;
  segLoadTried = true;
  try{
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js', 9000);
    if(!window.SelfieSegmentation) return null;
    const m = new window.SelfieSegmentation({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
    });
    m.setOptions({ modelSelection: 1 });   // 1 = landscape/general, better around hair
    segModel = m;
  }catch(e){ segModel = null; }
  return segModel;
}

/* ---------- share the finished card ---------- */
$('#card-share').onclick = async ()=>{
  const btn = $('#card-share'); btn.disabled = true;
  try{
    await drawCard();
    $('#card-canvas').toBlob(async blob=>{
      btn.disabled = false;
      if(!blob) return;
      const file = new File([blob], 'nigj-card.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:'NIGJ'}); return; }
        catch(e){ if(e.name === 'AbortError') return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'nigj-card.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      toast(t('result.saved'));
    }, 'image/png');
  }catch(e){ btn.disabled = false; }
};

   boot
========================================================= */
applyLang();
applyTheme();
updateStageBar('s-login');
